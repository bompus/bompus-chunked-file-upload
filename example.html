<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bompus Chunked File Upload 3.0 — example</title>
  <link rel="stylesheet" href="./bompus-chunked-file-upload.css" />
  <script src="./bompus-chunked-file-upload.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; line-height: 1.4; }
    .card { border: 1px solid #ddd; padding: 16px; margin-bottom: 16px; }
    input[type="file"] { display: block; width: 100%; margin-top: 8px; }
    #submitdiv { margin-top: 16px; padding: 12px; background: #f3f3f3; text-align: center; }
    .hint { color: #555; font-size: 0.9rem; }
    code { font-size: 0.85em; }
  </style>
</head>
<body>
  <h1>Bompus Chunked File Upload v3.0.3</h1>
  <p class="hint">Serve with <code>php -S localhost:8080</code> then open this page over HTTP.</p>

  <form id="demo-form" action="#" method="get">
    <div class="card">
      <strong>Upload a file</strong>
      <div data-bfu-text="upload-1"></div>
      <input data-bfu-file="upload-1" type="file" />
      <input data-bfu-hidden="upload-1" type="hidden" name="upload-1" value="" />
    </div>
    <div id="submitdiv">
      <div id="publish-status"></div>
      <button type="submit" id="publish">Submit</button>
    </div>
  </form>

  <script>
    (function () {
      var form = document.getElementById("demo-form");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (BompusFileUpload.formBusyCount(form) > 0) {
          return;
        }
        var hidden = document.querySelector('[data-bfu-hidden="upload-1"]');
        window.alert("Hidden field value: " + (hidden ? hidden.value : ""));
      });

      var up = BompusFileUpload({
        postUrl: "./upload.php",
        fieldName: "upload-1",
        formData: { meta: "upload-1" },
        downloadUrl: function (encoded) { return "./files/" + encoded; },
        beforeUpload: async function () {
          var name = this.file && this.file.name ? this.file.name : "";
          if (/\.exe$/i.test(name)) {
            throw "Executable files are not allowed.";
          }
        }
      });

      BompusFileUpload.mountDefaultUi(up, { linkNewUploads: true });

      BompusFileUpload.trackFormBusy(form, {
        onChange: function (count) {
          var status = document.getElementById("publish-status");
          if (!status) {
            return;
          }
          if (count > 0) {
            if (!status.querySelector(".inProgressPub")) {
              status.innerHTML = "<div class='inProgressPub'>Upload in progress — please wait.</div>";
            }
          } else {
            var el = status.querySelector(".inProgressPub");
            if (el) {
              el.remove();
            }
          }
        }
      });

      up.on("complete", function (p) {
        console.log("done", p.fileName, p.duration + "s", "bfu", document.querySelector("[data-bfu-hidden]").bfu === up);
      });
    })();
  </script>
</body>
</html>
