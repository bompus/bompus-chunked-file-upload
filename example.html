<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bompus Chunked File Upload v4.1.0</title>
  <link rel="stylesheet" href="./bompus-chunked-file-upload.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Bompus Chunked File Upload v4.1.0</h1>
  <p>Pick ≠ upload. This demo mounts a field and binds the file input to <code>upload()</code>.</p>
  <form id="demo">
    <div data-bfu-text="demo-1"></div>
    <input data-bfu-file="demo-1" type="file" />
    <input data-bfu-hidden="demo-1" type="hidden" name="demo-1" value="" />
    <p><button type="submit">Submit (blocked while busy)</button></p>
  </form>
  <p id="busy-note" hidden>Form busy…</p>
  <script src="./bompus-chunked-file-upload.js"></script>
  <script>
    var form = document.getElementById("demo");
    var fileInput = document.querySelector('[data-bfu-file="demo-1"]');
    var field = BompusFileUpload.mount({
      url: "./upload.php",
      data: { meta: "demo-1" },
      elements: {
        infoText: document.querySelector('[data-bfu-text="demo-1"]'),
        fileInput: fileInput,
        hiddenInput: document.querySelector('[data-bfu-hidden="demo-1"]'),
        form: form
      },
      downloadUrl: function (enc) { return "./files/" + enc; },
      linkNewUploads: true,
      chunkSizeMB: 0.98
    });
    BompusFileUpload.bindInput(fileInput, function (file) {
      return field.upload(file);
    });
    BompusFileUpload.trackFormBusy(form, {
      onChange: function (count) {
        document.getElementById("busy-note").hidden = count === 0;
      }
    });
    field.on("complete", function (d) { console.log("complete", d); });
    field.on("error", function (d) { console.warn("error", d); });
  </script>
</body>
</html>
